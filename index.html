<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Bus">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>My Bus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Doto:wght@900&display=swap" rel="stylesheet">
<!-- Your API key lives in config.js, so updating this file never touches it -->
<script src="config.js"></script>
<style>
:root{
  --bg:#ffffff; --ink:#000000; --soft:#f3f3f3; --soft2:#e9e9e9; --line:#e6e6e6;
  --mute:#6b6b6b; --best:#05834f; --best-bg:#e6f4ec; --tag:#eeeeee;
  --led:#ffb627; --alert:#c4281c; --alert-bg:#fdecea;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000000; --ink:#ffffff; --soft:#1c1c1c; --soft2:#2a2a2a; --line:#262626;
    --mute:#a3a3a3; --best:#4ccf8f; --best-bg:#0f2e20; --tag:#262626; --alert:#ff7b70; --alert-bg:#2e1412; }
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:500 16px/1.4 "Figtree",system-ui,sans-serif;
  padding:calc(10px + env(safe-area-inset-top)) 0 calc(40px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:left}
:focus-visible{outline:3px solid var(--best);outline-offset:2px;border-radius:10px}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

header{display:flex;justify-content:space-between;align-items:center;padding:6px 0 18px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em}
.clock{font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}

h1{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-bottom:16px}

/* from / to */
.trip{background:var(--soft);border-radius:16px;padding:6px 8px 6px 16px;display:grid;grid-template-columns:14px 1fr 44px;column-gap:14px;align-items:center}
.marks{grid-row:1 / span 3;display:flex;flex-direction:column;align-items:center;align-self:stretch;padding:22px 0}
.marks .o{width:9px;height:9px;border-radius:50%;background:var(--ink)}
.marks .l{flex:1;width:2px;background:var(--ink);opacity:.35;margin:4px 0}
.marks .s{width:9px;height:9px;background:var(--ink)}
.trip input{width:100%;border:0;background:transparent;outline:none;padding:14px 0;font-size:17px;font-weight:600}
.trip input::placeholder{color:var(--mute);font-weight:500}
#to{font-size:19px}
.trip .hr{grid-column:2;height:1px;background:var(--soft2)}
.swap{grid-column:3;grid-row:1 / span 3;width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700}

/* when */
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--soft);font-weight:600;font-size:15px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.time{display:none;padding:8px 12px;border-radius:999px;border:0;background:var(--soft);font-weight:700;font-size:15px}
.time.show{display:block}

/* saved places */
.places{margin-top:18px}
.place{width:100%;display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.place .ic{width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:17px;flex-shrink:0}
.place b{display:block;font-weight:700}
.place span.addr{display:block;color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place .txt{flex:1;min-width:0}
.place .del{color:var(--alert);font-weight:700;font-size:14px}
.links{display:flex;justify-content:space-between;margin-top:8px;font-size:14px}
.links button{color:var(--mute);font-weight:600;padding:6px 0}

.favform{display:none;margin-top:12px;gap:8px;flex-direction:column}
.favform.show{display:flex}
.favform input{padding:13px 14px;border-radius:12px;border:0;background:var(--soft);font-size:16px}
.favform .btns{display:flex;gap:8px}
.favform .btns button{flex:1;padding:13px;border-radius:12px;font-weight:700;text-align:center;background:var(--soft)}
.favform .btns .primary{background:var(--ink);color:var(--bg)}

.go{width:100%;margin-top:18px;padding:17px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;font-size:18px;text-align:center}
.go:active{opacity:.85}

.usage{margin-top:10px;font-size:13px;color:var(--mute);display:flex;justify-content:space-between;gap:10px}
.usage.warn{color:#a15c00}.usage.full{color:var(--alert);font-weight:700}
@media (prefers-color-scheme: dark){ .usage.warn{color:var(--led)} }

/* results */
#out{margin-top:28px}
.out-h{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.out-sub{color:var(--mute);font-size:14px;margin-bottom:12px}
.note{padding:14px 16px;border-radius:14px;background:var(--soft);font-size:15px}
.note.err{background:var(--alert-bg);color:var(--alert)}

/* rating colors */
:root{ --g:#05834f; --g-bg:#e7f5ed; --y:#a66300; --y-bg:#fdf1d8; --r:#c4281c; --r-bg:#fdecea; }
@media (prefers-color-scheme: dark){ :root{ --g:#4ccf8f; --g-bg:#0d2a1d; --y:#f5b545; --y-bg:#2e2310; --r:#ff7b70; --r-bg:#2e1412; } }

.rec{border-radius:18px;padding:16px 16px 14px;margin-bottom:26px;border:2px solid}
.rec.g{background:var(--g-bg);border-color:var(--g)}
.rec.r{background:var(--r-bg);border-color:var(--r)}
.rec-k{font-size:13px;font-weight:800;color:var(--g)}
.rec.r .rec-k{color:var(--r)}
.rec-main{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-top:4px}
.rec-main .no{display:inline-block;background:#000;color:var(--led);font-family:"Doto",monospace;font-weight:900;padding:0 7px;border-radius:6px;font-size:20px;vertical-align:1px}
.rec-facts{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:15px;color:var(--mute)}
.rec-facts b{color:var(--ink)}
.rec-alt{margin-top:10px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--g) 30%,transparent);font-size:14px;color:var(--mute)}
.rec-alt b{color:var(--ink)}

.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin:2px 0 12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:16px;height:7px;border-radius:4px}

.opt{width:100%;display:block;padding:12px 14px 14px;border-radius:16px;border:2px solid;margin-bottom:8px}
.opt.g{border-color:color-mix(in srgb,var(--g) 45%,transparent)}
.opt.y{border-color:color-mix(in srgb,var(--y) 45%,transparent)}
.opt.r{border-color:color-mix(in srgb,var(--r) 35%,transparent)}
.opt[aria-expanded="true"]{border-width:3px;padding:11px 13px 13px}
.opt.g[aria-expanded="true"]{border-color:var(--g)}
.opt.y[aria-expanded="true"]{border-color:var(--y)}
.opt.r[aria-expanded="true"]{border-color:var(--r)}
.opt-top{display:flex;align-items:center;gap:14px}
.opt.r .badge,.opt.r .mid b,.opt.r .right b{opacity:.75}

.rate{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-bottom:2px}
.rate i{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.rate.g{color:var(--g)}.rate.g i{background:var(--g)}
.rate.y{color:var(--y)}.rate.y i{background:var(--y)}
.rate.r{color:var(--r)}.rate.r i{background:var(--r)}

/* time bar */
.tbar{display:flex;height:10px;margin-top:12px;gap:2px;border-radius:5px;overflow:hidden}
.tbar i,.legend i{display:block;height:100%}
.tbar i:first-child{border-radius:5px 0 0 5px}.tbar i:last-child{border-radius:0 5px 5px 0}
i.home{background:repeating-linear-gradient(135deg,var(--soft2) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1px var(--soft2)}
i.walk{background:repeating-linear-gradient(90deg,var(--mute) 0 3px,transparent 3px 5px)}
i.stop{background:var(--soft2)}
i.bus{background:var(--ink)}
i.car{background:var(--led)}
.badge{min-width:58px;height:44px;padding:0 8px;border-radius:10px;background:#000;display:grid;place-items:center;flex-shrink:0;
  font-family:"Doto",monospace;font-weight:900;font-size:24px;color:var(--led);text-shadow:0 0 6px rgba(255,182,39,.55)}
@media (prefers-color-scheme: dark){ .badge{background:#161616;box-shadow:inset 0 0 0 1px #2c2c2c} }
.badge.car{font-family:inherit;font-size:24px;text-shadow:none;background:var(--soft)}
.mid{flex:1;min-width:0}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:3px}
.tags em{font-style:normal;font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--tag)}
.tags em.best{background:var(--best-bg);color:var(--best)}
.tags em.late{background:var(--alert-bg);color:var(--alert)}
.mid b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid .sub{display:block;color:var(--mute);font-size:14px}
.right{text-align:right;flex-shrink:0}
.right b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.right span{color:var(--mute);font-size:14px}

.detail{padding:6px 4px 18px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.leave{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:8px 0 4px}
.leave .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.leave .big small{font-size:18px;font-weight:700;letter-spacing:0;margin-left:3px}
.leave .lbl{color:var(--mute);font-size:14px;font-weight:600;margin-bottom:4px}
.leave.urgent .big{color:var(--alert)}
.hint{color:var(--mute);font-size:15px;margin-top:4px}
.hint b{color:var(--ink)}

.journey{list-style:none;padding:16px 0 0}
.j{display:grid;grid-template-columns:52px 16px 1fr;column-gap:12px}
.j .t{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;font-size:15px}
.j .line{display:flex;flex-direction:column;align-items:center}
.j .dot{width:11px;height:11px;border-radius:50%;background:var(--bg);border:2.5px solid var(--ink);margin-top:4px;flex-shrink:0}
.j .seg{flex:1;min-height:30px;margin:3px 0}
.j .seg.walk{border-left:2.5px dotted var(--mute)}
.j .seg.ride{width:6px;border-radius:3px;background:var(--ink)}
.j .what{padding-bottom:14px}
.j .stop{font-weight:700}
.j .sub{color:var(--mute);font-size:14px}
.j .no{display:inline-block;background:#000;color:var(--led);font-family:"Doto",monospace;font-weight:900;padding:0 6px;border-radius:5px;margin-right:4px}
.j:last-child .what{padding-bottom:0}

.actions{display:flex;gap:8px;margin-top:16px}
.actions a{flex:1;text-align:center;padding:13px;border-radius:12px;font-weight:700;text-decoration:none;background:var(--soft);color:var(--ink)}
.actions a.primary{background:var(--ink);color:var(--bg)}

.stopguide{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.sg-h b{display:block;font-size:17px;font-weight:800}
.sg-h span{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.sg-map{width:100%;height:230px;border:0;border-radius:14px;margin-top:12px;background:var(--soft)}
.loading{padding:8px 0}
.loading div{height:72px;border-radius:14px;background:linear-gradient(90deg,var(--soft) 0%,var(--soft2) 50%,var(--soft) 100%);background-size:200% 100%;animation:sh 1.2s infinite linear;margin-bottom:8px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){ .loading div{animation:none} }
.mapslink{display:block;text-align:center;margin-top:14px;color:var(--mute);font-weight:600;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">My Bus</div>
    <div class="clock" id="clock"></div>
  </header>

  <h1>Where to?</h1>

  <div class="trip">
    <div class="marks" aria-hidden="true"><span class="o"></span><span class="l"></span><span class="s"></span></div>
    <input id="from" placeholder="Current location" autocomplete="off" aria-label="From">
    <button class="swap" id="swapBtn" type="button" aria-label="Swap from and to">⇅</button>
    <div class="hr"></div>
    <input id="to" placeholder="Where are you going?" autocomplete="off" aria-label="To" enterkeyhint="search">
  </div>

  <div class="row" role="group" aria-label="When">
    <button type="button" class="pill" data-mode="now" aria-pressed="true">🕒 Leave now</button>
    <button type="button" class="pill" data-mode="depart" aria-pressed="false">Leave at</button>
    <button type="button" class="pill" data-mode="arrive" aria-pressed="false">Arrive by</button>
    <input type="time" id="time" class="time" aria-label="Time">
  </div>

  <div class="places" id="places"></div>
  <div class="favform" id="favform">
    <input id="favName" placeholder="Name, like Home or Work" autocomplete="off">
    <input id="favAddr" placeholder="Place, like Mazyad Mall" autocomplete="off">
    <div class="btns">
      <button type="button" id="favCancel">Cancel</button>
      <button type="button" id="favSave" class="primary">Save place</button>
    </div>
  </div>

  <button class="go" id="goBtn" type="button">Find buses</button>
  <div class="usage" id="usage" aria-live="polite"></div>

  <section id="out" aria-live="polite"></section>
</div>

<script>
/* The key comes from config.js:  window.MYBUS_KEY = "AIza...";  */
const API_KEY = (window.MYBUS_KEY && !window.MYBUS_KEY.startsWith("PASTE")) ? window.MYBUS_KEY : "";

/* Safety limits for Google requests (each search uses 3).
   Keep DAILY_LIMIT a bit BELOW the quota you set in Google Cloud. */
const DAILY_LIMIT = 90;
const MONTHLY_LIMIT = 2500;
const WARN_AT = 0.8;
const PER_SEARCH = 3;

/* How the app ranks trips: arrival time + this many minutes per minute of walking */
const WALK_PENALTY = 1.5;

const TZ = "Asia/Dubai";
const $ = id => document.getElementById(id);
let activeField = "to", whenMode = "now", editing = false, state = null, tick = null;

/* ---------- storage ---------- */
const load = (k,d) => { try{ const v = localStorage.getItem("mybus_"+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } };
const save = (k,v) => { try{ localStorage.setItem("mybus_"+k, JSON.stringify(v)); }catch(e){} };

/* ---------- time helpers ---------- */
const fmt = d => d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZone:TZ});
const fmtShort = d => fmt(d).replace(/ ?(AM|PM)/,"");
const secs = s => parseInt(String(s||"0").replace("s",""),10) || 0;
const mins = s => Math.max(1, Math.round(s/60));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const withCity = s => /\b(uae|united arab emirates|abu dhabi|dubai|al ain)\b/i.test(s) ? s : s + ", Abu Dhabi, UAE";
function clock(){ $("clock").textContent = fmt(new Date()); }
clock(); setInterval(clock, 15000);

/* ---------- usage counter (this device only) ---------- */
const dayKey = () => new Date().toLocaleDateString("en-CA",{timeZone:TZ});
function usage(){
  const u = load("usage", {});
  if(u.day !== dayKey()){ u.day = dayKey(); u.today = 0; }
  if(u.month !== dayKey().slice(0,7)){ u.month = dayKey().slice(0,7); u.thisMonth = 0; }
  return u;
}
function addUsage(n){ const u = usage(); u.today += n; u.thisMonth += n; save("usage",u); renderUsage(); }
function canSpend(n){ const u = usage(); return u.today + n <= DAILY_LIMIT && u.thisMonth + n <= MONTHLY_LIMIT; }
function renderUsage(){
  const u = usage(), left = Math.max(0, Math.floor((DAILY_LIMIT - u.today)/PER_SEARCH));
  const full = !canSpend(PER_SEARCH), warn = u.today >= DAILY_LIMIT*WARN_AT || u.thisMonth >= MONTHLY_LIMIT*WARN_AT;
  const box = $("usage");
  box.className = "usage" + (full ? " full" : warn ? " warn" : "");
  box.innerHTML = full
    ? `<span>Limit reached. Searches open Google Maps until ${u.today + PER_SEARCH > DAILY_LIMIT ? "tomorrow" : "next month"}.</span>`
    : `<span>${warn ? "Close to your limit: " : ""}${left} searches left today</span><span>${u.thisMonth}/${MONTHLY_LIMIT} this month</span>`;
}

/* ---------- saved places ---------- */
let favs = load("favs", []);
const icon = n => /home|casa/i.test(n) ? "🏠" : /work|office|trabajo|baker|training/i.test(n) ? "💼" : /mall|shop/i.test(n) ? "🛍️" : "📍";
function renderPlaces(){
  const box = $("places");
  box.innerHTML = favs.map((f,i) => `
    <button type="button" class="place" data-i="${i}">
      <span class="ic" aria-hidden="true">${icon(f.name)}</span>
      <span class="txt"><b>${esc(f.name)}</b><span class="addr">${esc(f.address)}</span></span>
      ${editing ? `<span class="del">Delete</span>` : ""}
    </button>`).join("") + `
    <div class="links">
      <button type="button" id="addPlace">+ Save a place</button>
      ${favs.length ? `<button type="button" id="editPlaces">${editing ? "Done" : "Edit"}</button>` : ""}
    </div>`;
  box.querySelectorAll(".place").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if(editing){ favs.splice(i,1); save("favs",favs); if(!favs.length) editing = false; renderPlaces(); return; }
    $(activeField).value = favs[i].address;
    if(activeField === "to") search(); else { activeField = "to"; $("to").focus(); }
  });
  $("addPlace").onclick = () => { $("favform").classList.add("show"); $("favAddr").value = $(activeField).value || ""; $("favName").value = ""; $("favName").focus(); };
  if($("editPlaces")) $("editPlaces").onclick = () => { editing = !editing; renderPlaces(); };
}
$("favCancel").onclick = () => $("favform").classList.remove("show");
$("favSave").onclick = () => {
  const name = $("favName").value.trim(), address = $("favAddr").value.trim();
  if(!name || !address){ (name ? $("favAddr") : $("favName")).focus(); return; }
  favs.push({name,address}); save("favs",favs); $("favform").classList.remove("show"); renderPlaces();
};

/* ---------- inputs ---------- */
["from","to"].forEach(id => $(id).addEventListener("focus", () => activeField = id));
$("swapBtn").onclick = () => { const a = $("from").value; $("from").value = $("to").value; $("to").value = a; };
$("to").addEventListener("keydown", e => { if(e.key === "Enter"){ e.target.blur(); search(); } });
document.querySelectorAll(".pill[data-mode]").forEach(b => b.onclick = () => {
  document.querySelectorAll(".pill[data-mode]").forEach(x => x.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true"); whenMode = b.dataset.mode;
  $("time").classList.toggle("show", whenMode !== "now");
  if(whenMode !== "now" && !$("time").value){
    const d = new Date(Date.now()+30*60000);
    $("time").value = String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }
});
function chosenTime(){
  const [h,m] = $("time").value.split(":").map(Number);
  const d = new Date(); d.setHours(h,m,0,0);
  if(d < new Date()) d.setDate(d.getDate()+1);
  return d;
}
function getLocation(){
  return new Promise((res,rej) => {
    if(!navigator.geolocation) return rej(new Error("This device can't share its location. Type where you are in the first box."));
    navigator.geolocation.getCurrentPosition(
      p => res({latitude:p.coords.latitude, longitude:p.coords.longitude}),
      () => rej(new Error("Location is off for this page. Allow it in Settings, or type where you are in the first box.")),
      {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
  });
}

/* ---------- links ---------- */
function mapsLink(from,to,mode){
  const p = new URLSearchParams({api:"1", destination:withCity(to), travelmode:mode||"transit"});
  if(from) p.set("origin", withCity(from));
  return "https://www.google.com/maps/dir/?" + p;
}
function uberLink(from,to){
  const p = new URLSearchParams({action:"setPickup"});
  if(from) p.set("pickup[formatted_address]", withCity(from)); else p.set("pickup","my_location");
  p.set("dropoff[formatted_address]", withCity(to));
  return "https://m.uber.com/ul/?" + p;
}

/* ---------- price estimates (official Abu Dhabi rates, no Google credits used) ----------
   Bus: AED 2 boarding + AED 0.05 per km (transfers within 60 min are free)
   Taxi: AED 5.00 day / 5.50 night flag fall + AED 1.82 per km, minimum AED 12,
         booking fee AED 4 day / 5 night when booked by app, plus some traffic waiting */
const busFare = km => Math.round((2 + 0.05*km)*20)/20;
function taxiFare(km, carMin){
  const h = +new Date().toLocaleString("en-US",{hour:"numeric",hour12:false,timeZone:TZ});
  const night = h >= 22 || h < 6;
  const meter = Math.max(12, (night ? 5.5 : 5) + 1.82*km);
  const freeFlowMin = km / 60 * 60;                       // ~60 km/h average
  const waiting = Math.max(0, carMin - freeFlowMin) * 0.5 * 0.5; // part of slow traffic billed at AED 0.50/min
  const low = Math.round(meter), high = Math.round(meter + waiting + (night ? 5 : 4));
  return {low, high, mid:(low+high)/2};
}
const aed = n => "AED " + (Number.isInteger(n) ? n : n.toFixed(2));

/* ---------- Google calls ---------- */
async function callRoutes(body, mask){
  addUsage(1);
  const r = await fetch("https://routes.googleapis.com/directions/v2:computeRoutes", {
    method:"POST",
    headers:{"Content-Type":"application/json","X-Goog-Api-Key":API_KEY,"X-Goog-FieldMask":mask},
    body:JSON.stringify(body)
  });
  const data = await r.json();
  if(!r.ok) throw new Error(data?.error?.message || "Google returned error " + r.status);
  return data;
}
const BUS_MASK = "routes.duration,routes.legs.steps.travelMode,routes.legs.steps.staticDuration,routes.legs.steps.distanceMeters,routes.legs.steps.transitDetails";

/* ---------- search ---------- */
$("goBtn").onclick = search;
async function search(){
  const out = $("out"), from = $("from").value.trim(), to = $("to").value.trim();
  clearInterval(tick);
  if(!to){ out.innerHTML = `<p class="note err">Add where you're going.</p>`; $("to").focus(); return; }
  const gm = `<a class="mapslink" href="${mapsLink(from,to)}" target="_blank" rel="noopener">Open in Google Maps</a>`;

  if(!API_KEY){
    out.innerHTML = `<p class="note"><b>Bus details need your API key.</b> Add it to config.js in your GitHub repo. Until then, Google Maps can show this trip.</p>${gm}`;
    return;
  }
  if(!canSpend(PER_SEARCH)){
    renderUsage();
    out.innerHTML = `<p class="note err"><b>Limit reached.</b> To keep Google free, the app stopped asking Google for bus details. Google Maps still works.</p>${gm}`;
    return;
  }
  out.innerHTML = `<div class="loading" aria-label="Searching"><div></div><div></div><div></div></div>`;
  out.scrollIntoView({behavior:"smooth", block:"start"});

  try{
    const here = from ? null : await getLocation();
    const origin = from ? {address:withCity(from)} : {location:{latLng:here}};
    const deadline = whenMode === "arrive" ? chosenTime() : null;
    const base = {origin, destination:{address:withCity(to)}, travelMode:"TRANSIT",
      computeAlternativeRoutes:true, languageCode:"en", units:"METRIC", regionCode:"AE"};
    if(whenMode === "depart") base.departureTime = chosenTime().toISOString();
    if(whenMode === "arrive") base.arrivalTime = deadline.toISOString();

    const [fast, easy, car] = await Promise.allSettled([
      callRoutes(base, BUS_MASK),
      callRoutes({...base, transitPreferences:{routingPreference:"LESS_WALKING"}}, BUS_MASK),
      callRoutes({origin, destination:{address:withCity(to)}, travelMode:"DRIVE", routingPreference:"TRAFFIC_AWARE",
        languageCode:"en", units:"METRIC", regionCode:"AE"}, "routes.duration,routes.distanceMeters")
    ]);
    if([fast,easy,car].every(r => r.status === "rejected")) throw fast.reason;

    // merge both bus searches, remove duplicates and buses you can't catch
    const seen = new Set(), trips = [];
    for(const res of [fast, easy]){
      if(res.status !== "fulfilled") continue;
      for(const r of (res.value.routes||[])){
        const t = parse(r); if(!t) continue;
        const key = t.buses.map(b => b.no).join(">") + "@" + t.buses[0].dep.getTime();
        if(seen.has(key) || t.leave < Date.now() - 60000) continue;
        seen.add(key); trips.push(t);
      }
    }
    const nowRef = whenMode === "depart" ? chosenTime() : new Date();
    trips.forEach(t => {
      t.late = deadline ? t.arrive > deadline : false;
      t.score = (t.arrive - nowRef)/60000 + t.walk*WALK_PENALTY + (t.buses.length-1)*8 + (t.late ? 1000 : 0);
    });
    trips.sort((a,b) => a.score - b.score);

    const c = car.status === "fulfilled" && car.value.routes?.[0]
      ? {sec:secs(car.value.routes[0].duration), km:(car.value.routes[0].distanceMeters||0)/1000} : null;

    state = {trips: trips.slice(0,5), car:c, from, to, deadline, open: 0, gm, here};
    render();
    tick = setInterval(render, 30000);
  }catch(e){
    out.innerHTML = `<p class="note err">${esc(e.message)}</p>${gm}`;
  }
}

/* ---------- turn Google's steps into a simple trip ---------- */
function parse(route){
  const steps = (route.legs||[]).flatMap(l => l.steps||[]);
  const parts = [];
  for(const s of steps){
    if(s.travelMode === "TRANSIT" && s.transitDetails){
      const t = s.transitDetails, line = t.transitLine||{}, sd = t.stopDetails||{};
      parts.push({type:"bus", no:line.nameShort||line.name||"Bus", dest:t.headsign||line.name||"",
        fromLL:sd.departureStop?.location?.latLng || null, toLL:sd.arrivalStop?.location?.latLng || null,
        from:sd.departureStop?.name||"Bus stop", to:sd.arrivalStop?.name||"Bus stop",
        dep:new Date(sd.departureTime), arr:new Date(sd.arrivalTime), stops:t.stopCount||0, m:s.distanceMeters||0});
    }else{
      const last = parts[parts.length-1], sec = secs(s.staticDuration), m = s.distanceMeters||0;
      if(last && last.type === "walk"){ last.sec += sec; last.m += m; }
      else parts.push({type:"walk", sec, m});
    }
  }
  const buses = parts.filter(p => p.type === "bus");
  if(!buses.length) return null;
  const i0 = parts.indexOf(buses[0]), iN = parts.indexOf(buses[buses.length-1]);
  const before = parts.slice(0,i0).reduce((a,p)=>a+p.sec,0);
  const after = parts.slice(iN+1).reduce((a,p)=>a+p.sec,0);
  const walkSec = parts.filter(p => p.type === "walk").reduce((a,p)=>a+p.sec,0);
  const busKm = buses.reduce((a,b)=>a+b.m,0)/1000;
  return {parts, buses, walk:Math.round(walkSec/60), walkFirst:Math.round(before/60), fare:busFare(busKm),
    leave:new Date(buses[0].dep - before*1000),
    arrive:new Date(buses[buses.length-1].arr.getTime() + after*1000),
    total:mins(secs(route.duration))};
}

/* ---------- draw ---------- */
function render(){
  if(!state) return;
  const {trips, car, from, to, deadline, gm, here} = state;
  const out = $("out");
  const carArrive = car ? new Date(Date.now() + car.sec*1000 + 5*60000) : null;
  const taxi = car ? taxiFare(car.km, mins(car.sec)) : null;
  const anyOnTime = trips.some(t => !t.late);

  const busBest = trips.find(t => !t.late);
  const taxiFirst = car && !busBest;
  const now = Date.now();

  /* ---- rating: green / yellow / red, always compared with the best bus ---- */
  if(trips.length){
    const minWalk = Math.min(...trips.map(t => t.walk));
    trips.forEach((t,i) => {
      t.extras = [];
      if(t.walk === minWalk && trips.length > 1) t.extras.push("Least walking");
      if(t.late){ t.rate = "r"; t.label = `Arrives after ${fmt(deadline)}`; return; }
      if(t === busBest){ t.rate = "g"; t.label = "Best choice"; return; }
      const later = Math.round((t.arrive - busBest.arrive)/60000), moreWalk = t.walk - busBest.walk;
      const diff = t.score - busBest.score;
      const why = later > 0 ? `${later} min later` : moreWalk > 0 ? `${moreWalk} min more walking` : "";
      if(diff <= 10){ t.rate = "g"; t.label = "Also good"; }
      else if(diff <= 25){ t.rate = "y"; t.label = "Okay" + (why ? " · " + why : ""); }
      else { t.rate = "r"; t.label = "Not worth it" + (why ? " · " + why : ""); }
    });
  }
  let taxiRate = null;
  if(car){
    const saved = busBest ? Math.round((busBest.arrive - carArrive)/60000) : 0;
    const extra = busBest ? Math.round(taxi.mid - busBest.fare) : 0;
    if(taxiFirst) taxiRate = {rate:"g", label:"Only way on time"};
    else if(saved >= 20 && extra/saved <= 2) taxiRate = {rate:"g", label:`Good if you're in a hurry · saves ${saved} min`};
    else if(saved >= 8) taxiRate = {rate:"y", label:`Saves ${saved} min · costs ~AED ${extra} more`};
    else taxiRate = {rate:"r", label: saved > 0 ? `Only ${saved} min faster · ~AED ${extra} more` : "No faster than the bus"};
    taxiRate.saved = saved; taxiRate.extra = extra;
  }

  /* ---- time bars: same scale for every option ---- */
  function busSegs(t){
    const segs = []; let cur = now;
    if(t.leave > cur){ segs.push(["home", t.leave - cur]); cur = +t.leave; }
    for(const p of t.parts){
      if(p.type === "walk"){ if(p.sec >= 30){ segs.push(["walk", p.sec*1000]); } cur += p.sec*1000; }
      else { if(p.dep > cur) segs.push(["stop", p.dep - cur]); segs.push(["bus", p.arr - p.dep]); cur = +p.arr; }
    }
    return segs;
  }
  const carSegs = () => [["stop", 5*60000], ["car", car.sec*1000]];
  const ends = [...trips.map(t => +t.arrive), car ? +carArrive : 0];
  const span = Math.max(...ends) - now || 1;
  const bar = segs => `<span class="tbar" aria-hidden="true">${segs.map(([k,ms]) =>
      `<i class="${k}" style="width:${Math.max(1.5, ms/span*100)}%"></i>`).join("")}</span>`;

  const rows = [];
  if(taxiFirst) rows.push({kind:"car"});
  trips.forEach((t,i) => rows.push({kind:"bus", t, i}));
  if(car && !taxiFirst) rows.push({kind:"car"});
  if(state.open >= rows.length) state.open = 0;

  /* ---- recommendation card ---- */
  let rec = "";
  if(busBest){
    const b = busBest.buses[0], inMin = Math.round((busBest.leave - now)/60000);
    const when = inMin <= 0 ? "Leave now" : inMin < 60 ? `Leave in ${inMin} min` : `Leave at ${fmt(busBest.leave)}`;
    const hurry = taxiRate && taxiRate.rate !== "r" && taxiRate.saved >= 8
      ? `<p class="rec-alt">In a hurry? A taxi gets you there <b>${taxiRate.saved} min sooner</b> for about <b>AED ${taxiRate.extra} more</b>.</p>` : "";
    rec = `<div class="rec g"><span class="rec-k">Recommended</span>
      <p class="rec-main">Take bus <span class="no">${esc(b.no)}</span> towards ${esc(b.dest)}</p>
      <p class="rec-facts"><b>${when}</b><span>Arrive ${fmt(busBest.arrive)}</span><span>🚶 ${busBest.walk} min</span><span>${aed(busBest.fare)}</span></p>${hurry}</div>`;
  } else if(car){
    const bookBy = deadline ? new Date(deadline - car.sec*1000 - 5*60000) : null;
    rec = `<div class="rec r"><span class="rec-k">${deadline ? `No bus arrives by ${fmt(deadline)}` : "No bus you can still catch"}</span>
      <p class="rec-main">Take a taxi or Uber</p>
      <p class="rec-facts"><b>${bookBy && bookBy > now ? `Book by ${fmt(bookBy)}` : "Book now"}</b><span>Arrive ~${fmt(carArrive)}</span><span>~AED ${taxi.low}–${taxi.high}</span></p></div>`;
  }

  const legend = `<div class="legend" aria-hidden="true"><span><i class="home"></i>Wait at home</span><span><i class="walk"></i>Walk</span><span><i class="stop"></i>Wait at stop</span><span><i class="bus"></i>Bus</span>${car ? `<span><i class="car"></i>Taxi</span>` : ""}</div>`;

  out.innerHTML = rec + `<h2 class="out-h">All options</h2>` + legend +
    rows.map((r,idx) => {
      const open = idx === state.open;
      if(r.kind === "car"){
        return `<button type="button" class="opt ${taxiRate.rate}" data-row="${idx}" aria-expanded="${open}">
            <span class="opt-top">
              <span class="badge car" aria-hidden="true">🚕</span>
              <span class="mid"><span class="rate ${taxiRate.rate}"><i></i>${esc(taxiRate.label)}</span>
                <b>Taxi or Uber</b><span class="sub">Door to door · ~AED ${taxi.low}–${taxi.high}</span></span>
              <span class="right"><b>${fmt(carArrive)}</b><span>${mins(car.sec)+5} min</span></span>
            </span>${bar(carSegs())}
          </button>` + (open ? carDetail() : "");
      }
      const t = r.t, b = t.buses[0];
      const subTxt = `Leave ${fmt(t.leave)} · 🚶 ${t.walk} min · ${aed(t.fare)}${t.buses.length > 1 ? ` · ${t.buses.length} buses` : ""}`;
      return `<button type="button" class="opt ${t.rate}" data-row="${idx}" aria-expanded="${open}">
          <span class="opt-top">
            <span class="badge" aria-label="Bus ${esc(b.no)}">${esc(b.no)}</span>
            <span class="mid"><span class="rate ${t.rate}"><i></i>${esc(t.label)}</span>
              <b>${esc(b.dest || "Bus " + b.no)}</b><span class="sub">${subTxt}</span></span>
            <span class="right"><b>${fmt(t.arrive)}</b><span>${t.total} min</span></span>
          </span>${bar(busSegs(t))}
        </button>` + (open ? busDetail(t) : "");
    }).join("") + (trips.length ? "" : gm);

  out.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const i = +b.dataset.row; state.open = state.open === i ? -1 : i; render();
  });

  function carDetail(){
    let line = "";
    if(deadline){
      const bookBy = new Date(deadline - car.sec*1000 - 5*60000);
      line = bookBy > Date.now()
        ? `<p class="hint">To arrive by <b>${fmt(deadline)}</b>, book it by <b>${fmt(bookBy)}</b>.</p>`
        : `<p class="hint">Even by car you'd arrive around <b>${fmt(carArrive)}</b>.</p>`;
    } else line = `<p class="hint">About <b>${mins(car.sec)} min</b> with current traffic, plus a few minutes for pickup.</p>`;
    let compare = "";
    if(busBest){
      const saved = Math.round((busBest.arrive - carArrive)/60000), extra = Math.round(taxi.mid - busBest.fare);
      compare = saved > 0
        ? `<p class="hint">Compared with the best bus (${aed(busBest.fare)}): you arrive <b>${saved} min earlier</b> for about <b>AED ${extra} more</b>${saved >= 5 ? ` — roughly <b>AED ${(extra/saved).toFixed(1)} per minute saved</b>` : ""}.</p>`
        : `<p class="hint">The best bus (${aed(busBest.fare)}) gets you there about as fast.</p>`;
    }
    return `<div class="detail">
      <div class="leave"><div><div class="lbl">Estimated price</div><div class="big">${taxi.low}–${taxi.high}<small>AED</small></div></div>
        <div style="text-align:right"><div class="lbl">${car.km.toFixed(1)} km</div><div style="font-weight:800;font-size:22px">${mins(car.sec)} min</div></div></div>
      ${line}${compare}
      <p class="hint" style="font-size:13px">Estimate from official Abu Dhabi taxi rates. Uber and Careem show the exact price before you confirm.</p>
      <div class="actions"><a class="primary" href="${uberLink(from,to)}" target="_blank" rel="noopener">Open Uber</a>
      <a href="${mapsLink(from,to,"driving")}" target="_blank" rel="noopener">Car route</a></div></div>`;
  }

  function busDetail(t){
    const b = t.buses[0];
    const inMin = Math.round((t.leave - Date.now())/60000);
    let lbl, big;
    if(inMin <= 0){ lbl = "Leave"; big = "Now"; }
    else if(inMin < 60){ lbl = "Leave in"; big = `${inMin}<small>min</small>`; }
    else { lbl = "Leave at"; big = fmt(t.leave).replace(/ ?(AM|PM)/,"<small>$1</small>"); }
    const wait = inMin >= 8
      ? `<p class="hint">No rush. Bus <b>${esc(b.no)}</b> leaves <b>${esc(b.from)}</b> at <b>${fmt(b.dep)}</b>. Start walking at <b>${fmt(t.leave)}</b>.</p>`
      : `<p class="hint">Bus <b>${esc(b.no)}</b> leaves <b>${esc(b.from)}</b> at <b>${fmt(b.dep)}</b>.</p>`;

    const rows = [{t:t.leave, stop:"Start", sub:"", seg:null}];
    t.parts.forEach(p => {
      if(p.type === "walk"){
        if(p.sec < 30) return;
        const r = rows[rows.length-1]; r.seg = "walk";
        r.sub += (r.sub ? "<br>" : "") + `Walk ${mins(p.sec)} min · ${Math.round(p.m)} m`;
      } else {
        rows.push({t:p.dep, stop:esc(p.from), sub:`<span class="no">${esc(p.no)}</span> towards ${esc(p.dest)}${p.stops ? ` · ${p.stops} stops` : ""}`, seg:"ride"});
        rows.push({t:p.arr, stop:esc(p.to), sub:"Get off", seg:null});
      }
    });
    const lastPart = t.parts[t.parts.length-1];
    if(lastPart.type === "walk" && lastPart.sec >= 30) rows.push({t:t.arrive, stop:esc(to), sub:"Arrive", seg:null});

    return `<div class="detail">
      <div class="leave${inMin <= 5 ? " urgent" : ""}">
        <div><div class="lbl">${lbl}</div><div class="big">${big}</div></div>
        <div style="text-align:right"><div class="lbl">Arrive</div><div style="font-weight:800;font-size:22px">${fmt(t.arrive)}</div></div>
      </div>${wait}
      <ol class="journey">${rows.map(r => `<li class="j"><span class="t">${fmtShort(r.t)}</span>
        <span class="line"><span class="dot"></span>${r.seg ? `<span class="seg ${r.seg}"></span>` : ""}</span>
        <div class="what"><div class="stop">${r.stop}</div>${r.sub ? `<div class="sub">${r.sub}</div>` : ""}</div></li>`).join("")}</ol>
      ${stopGuide(b)}
      <div class="actions"><a href="${mapsLink(from,to)}" target="_blank" rel="noopener">Whole trip in Google Maps</a></div>
    </div>`;
  }

  /* walking guidance to the exact stop (correct side of the road) */
  function stopGuide(b){
    if(!b.fromLL) return "";
    const stop = `${b.fromLL.latitude},${b.fromLL.longitude}`;
    const start = here ? `${here.latitude},${here.longitude}` : withCity(from);
    const walk = new URLSearchParams({api:"1", destination:stop, travelmode:"walking"});
    if(!here && from) walk.set("origin", withCity(from));
    const embed = new URLSearchParams({key:API_KEY, origin:start, destination:stop, mode:"walking"});
    return `<div class="stopguide">
      <div class="sg-h"><b>Walk to ${esc(b.from)}</b><span>Use the stop for buses going towards ${esc(b.dest)}. The pin marks the right side of the road.</span></div>
      <iframe class="sg-map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Walking route to ${esc(b.from)}"
        src="https://www.google.com/maps/embed/v1/directions?${embed}"></iframe>
      <div class="actions" style="margin-top:10px"><a class="primary" href="https://www.google.com/maps/dir/?${walk}" target="_blank" rel="noopener">🚶 Walk to the stop</a></div>
    </div>`;
  }
}

renderPlaces();
renderUsage();
</script>
